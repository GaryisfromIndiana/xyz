[toolchain]
anchor_version = "0.31.1"
solana_version = "2.1.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
credit_vault = "FxpPCZhoY2ecs9g9w5M9VK7m5fMW8mWF28hjhrE8QGtY"

[programs.devnet]
credit_vault = "FxpPCZhoY2ecs9g9w5M9VK7m5fMW8mWF28hjhrE8QGtY"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
# Load the program as upgradeable with the provider wallet as upgrade authority, matching a real
# deployment; `initialize` is gated on the upgrade authority.
upgradeable = true
